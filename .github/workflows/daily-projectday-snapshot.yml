name: Daily Project Day snapshot

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Flodesk snapshot
        env:
          FLODESK_API_KEY: ${{ secrets.FLODESK_API_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/fetch-flodesk-projectday-snapshot.mjs

      - name: Commit updated history
        run: |
          git config user.name "projectday-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add projectday/data/history.json
          git diff --cached --quiet || git commit -m "Daily Project Day snapshot: $(date -u +%F)"
          git push
